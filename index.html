<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crepe Master - Point and Click Cooking Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="score-panel">
                <div>Score: <span id="score">0</span></div>
                <div>Money: $<span id="money">0</span></div>
                <div>Day: <span id="day">1</span></div>
                <div>Time: <span id="timer">60</span>s</div>
            </div>
            <div id="instructions">
                <h3>How to Play:</h3>
                <p>1. Click BATTER to cook crepe</p>
                <p>2. Click pan → move to plate</p>
                <p>3. Add toppings to match order</p>
                <p>4. Click SERVE when ready!</p>
            </div>
            <div id="current-order">
                <h3>Current Customer Order:</h3>
                <div id="order-display">No customers</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-over" class="hidden">
            <h2>Day Complete!</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <p>Money Earned: $<span id="final-money">0</span></p>
            <button id="next-day">Next Day</button>
            <button id="restart">Restart</button>
        </div>
    </div>

    <script src="ingredients.js"></script>
    <script src="cookingStation.js"></script>
    <script src="customer.js"></script>
    <script src="player.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
</body>
</html>
